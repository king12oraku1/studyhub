            <h2 class="section-title">Past Questions</h2>

                    <option value="">Select College</option>
                </select>
                <select id="pqProgramme" disabled>
                    <option value="">Select Programme</option>
                </select>
                <select id="pqLevel" disabled>
                    <option value="">Select Level</option>
                </select>
                <select id="pqSemester" disabled>
                    <option value="">Select Semester</option>
                </select>
                <select id="pqCourse" disabled>
                    <option value="">Select Course</option>
                </select>
                <select id="pqYear" disabled>
                    <option value="">Select Year</option>
                </select>
                <button type="button" class="btn btn-outline" id="resetFiltersBtn">Reset Filters</button>
            </div>
            <div class="pdf-viewer-container" id="pqViewer">
                <p class="placeholder-text">Select a course and year to view past questions</p>
            </div>
        </div>
    </section>
