<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudiyHub - Quiz</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
</head>
<body data-page="quiz">
    <nav class="navbar" id="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">StudiyHub</a>
            <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="notes.html" class="nav-link">Notes</a></li>
                <li><a href="past-questions.html" class="nav-link">Past Questions</a></li>
                <li><a href="quiz.html" class="nav-link">Practice Quiz</a></li>
                <li><a href="index.html#courses" class="nav-link">Courses</a></li>
                <li><a href="index.html#about" class="nav-link">About</a></li>
                <li><a href="index.html#contact" class="nav-link">Contact</a></li>
            </ul>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
        </div>
    </nav>

    <section class="quiz-section" style="margin-top: 80px;">
        <div class="container">
            <h2 class="section-title">Practice Quiz</h2>

            <div class="quiz-setup" id="quizSetup">
                <div class="setup-card">
                    <h3>Configure Your Quiz</h3>
                    <div class="setup-group">
                        <label for="quizCourse">Course</label>
                        <select id="quizCourse"></select>
                    </div>
                    <div class="setup-group">
                        <label for="quizCount">Number of Questions</label>
                        <select id="quizCount">
                            <option value="5">5</option>
                            <option value="10">10</option>
                            <option value="20">20</option>
                            <option value="30">30</option>
                            <option value="50">50</option>
                        </select>
                    </div>
                    <div class="setup-group">
                        <label for="quizDuration">Duration</label>
                        <select id="quizDuration">
                            <option value="5">5 Minutes</option>
                            <option value="10">10 Minutes</option>
                            <option value="20">20 Minutes</option>
                            <option value="30">30 Minutes</option>
                            <option value="60">60 Minutes</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" id="startQuizBtn">Start Quiz</button>
                </div>
            </div>

            <div class="quiz-interface hidden" id="quizInterface">
                <div class="quiz-header">
                    <div class="quiz-progress">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <span id="questionCounter">1 / 10</span>
                    </div>
                    <div class="quiz-timer" id="quizTimer">10:00</div>
                </div>
                <div class="quiz-body">
                    <div class="question-card">
                        <h3 id="questionText">Question text here</h3>
                        <div class="options-grid" id="optionsGrid"></div>
                    </div>
                </div>
                <div class="quiz-footer">
                    <button class="btn btn-outline" id="prevBtn">Previous</button>
                    <button class="btn btn-primary" id="nextBtn">Next</button>
                    <button class="btn btn-success hidden" id="submitBtn">Submit Quiz</button>
                </div>
            </div>

            <div class="question-navigator" id="questionNavigator"></div>

            <div class="quiz-results hidden" id="quizResults">
                <div class="results-card">
                    <h3>Quiz Results</h3>
                    <div class="results-summary" id="resultsSummary"></div>
                    <div class="results-details" id="resultsDetails"></div>
                    <div class="results-actions">
                        <button class="btn btn-primary" id="retakeBtn">Retake Quiz</button>
                        <button class="btn btn-secondary" id="newQuizBtn">New Quiz</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 StudiyHub. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/questions.js"></script>
    <script src="js/notes.js"></script>
    <script src="js/pastQuestions.js"></script>
    <script src="js/quiz.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
